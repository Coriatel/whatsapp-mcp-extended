services:
  whatsapp-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: wa-bridge
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./store:/app/whatsapp-bridge/store
      - /opt/windmill-shared/wa-media:/app/media/lesson-pipeline:ro
    environment:
      - TZ=Asia/Jerusalem
      - API_KEY=${API_KEY:?API_KEY is required - see .env.example}
      - DISABLE_AUTH_CHECK=${DISABLE_AUTH_CHECK:-false}
      - RECEIPTS_WEBHOOK_URL=${RECEIPTS_WEBHOOK_URL:-https://yafutsu.merkazneshama.co.il/api/v1/wa-receipts/webhook}
      - RECEIPT_DEBUG=${RECEIPT_DEBUG:-0}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - whatsapp_internal

  whatsapp-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: wa-mcp
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    ports:
      - "127.0.0.1:8181:8081"
      - "127.0.0.1:8182:8082"
    volumes:
      - ./store:/app/store
    environment:
      - TZ=Asia/Jerusalem
      - DEBUG=true
      - GRADIO=false
      - BRIDGE_HOST=whatsapp-bridge
      - API_KEY=${API_KEY}
    depends_on:
      - whatsapp-bridge
    restart: unless-stopped
    networks:
      - whatsapp_internal

  web-ui:
    build:
      context: .
      dockerfile: Dockerfile.web-ui
    container_name: wa-web-ui
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: "0.25"
    ports:
      - "127.0.0.1:8190:8080"
    depends_on:
      - whatsapp-bridge
    restart: unless-stopped
    networks:
      - whatsapp_internal

networks:
  whatsapp_internal:
    driver: bridge
